[pytest]
addopts = -v -s --alluredir=allure-results --reruns 0 --reruns-delay 1
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Allure 日志配置
log_cli = true
log_cli_level = INFO

# 日志格式：%(pathname)s 文件路径 %(module)s 模块名 %(funcName)s 函数名
log_cli_format = %(asctime)s - %(levelname)s - %(filename)s - [%(funcName)s] - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    functional: 功能测试
    p0: 最高优先级用例（阻塞级，可用 -m p0 单独执行）
    p1: 高优先级用例（可用 -m p1 单独执行）
    algo: 算法 DLL 测试
    basic: 基础接口测试
    pathfinding: 路径规划测试
    safety: 安全检查测试
    matching: 最佳匹配测试
    collision: 碰撞解决测试
    takeoffland: 起降分配测试
    fileops: 文件操作测试
    ai: AI 转换测试
    wifi: WiFi 模块测试
    wifi_functional: WiFi 功能测试
    wifi_performance: WiFi 性能测试
    wifi_release: WiFi Release 测试
    wifi_stress: WiFi 压测
