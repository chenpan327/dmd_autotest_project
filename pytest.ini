[pytest]
# ============================== 基础配置 ==============================
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ============================== Allure 配置（核心） ==============================
# 1. 生成 Allure 原始数据（存储路径：与 pytest.ini 同级的 allure-results 目录）
# 2. 注意：需先安装 allure-pytest 插件（pip install allure-pytest）
addopts = -v -s
          --alluredir=./allure-results  # 生成 Allure 数据的目录（相对当前目录）
          --clean-alluredir  # 每次运行前清空 allure-results 目录，避免旧数据干扰

# ============================== 日志 ==============================
# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(message)s

# ============================== 测试标记 ==============================
markers =
    unit: unit tests
    integration: integration tests
    smoke: smoke tests