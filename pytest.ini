[pytest]
# 指定测试用例的根目录（相对路径，基于 pytest.ini 所在位置）
testpaths = src/Script/Functional_Testing/Web/

# 测试文件/类/函数命名规则（配合 testpaths 过滤文件）
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 自定义标记
markers =
    airplane: 飞机相关功能测试
    at_command: AT指令专项测试

# 超时配置
timeout = 30

# Allure 结果目录（根目录下）
addopts = --alluredir=./allure-results