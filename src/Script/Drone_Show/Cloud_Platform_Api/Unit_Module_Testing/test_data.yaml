test_calculate_price:
  - name: 计算成功
    args:
      rentTime: null
      rentTimeEnd: null
    jsonpath_args:
      - [ "$.uavEquipmentRentItemList[0].type", '1' ]
      - [ "$.uavEquipmentRentItemList[0].rentCount", 10 ]

    expected:
      - [ "$.code", "eq", 200 ]
      - [ "$.success","eq",true ]
      - [ "$.result.items[0].type", "eq","1" ]
      - [ "$.result.amount", "eq",800.00 ]

  - name: 计算失败
    args:
      rentTime: null
      rentTimeEnd: null
    jsonpath_args:
      - [ "$.uavEquipmentRentItemList[0].type", '10' ]
      - [ "$.uavEquipmentRentItemList[0].rentCount", 1 ]
    expected:
      - [ "$.code", "eq", 500 ]
      - [ "$.success","eq",false ]
      - [ "$.message","eq","费用价格缺失，请联系平台方处理！" ]
      - [ "$.result", "is_none" ]

