test_get_token:
  - name: 登录失败
    args:
      username: alan
      password: dd@2025

    expected:
      - [ "$.code", "eq", 400 ]
      - [ "$.data", "is_none" ]
      - [ "$.message", "contains", "incorrect" ]

  - name: 登录成功
    args:
      username: alan
      password: dmd@2025

    expected:
      - [ "$.code", "eq", 200 ]
      - [ "$.data.expiresIn", "gt", 123 ]
      - [ "$.data.token", "not_none" ]
      - [ "$.message", "contains", "success" ]

