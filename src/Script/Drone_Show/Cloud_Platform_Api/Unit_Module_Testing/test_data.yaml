test_send_repair:
  - name: 新增送修
    args:
      projectId: "2061718228239933441"
      projectName: test2026-06-02
      returnWarehouseId: B03
    jsonpath_args:
      - [ "$.breakdownRecords[0].deviceId", 'WV3000000083' ]
    expected:
      - [ "$.success","eq",true ]
      - [ "$.message","eq","操作成功" ]
      - [ "$.result.orderNo","not_none" ]
      - [ "$.result.status","eq",0 ]

  - name: 重复送修
    args:
      projectId: "2061718228239933441"
      projectName: test2026-06-02
      returnWarehouseId: B03
    jsonpath_args:
      - [ "$.breakdownRecords[0].deviceId", 'WV3000000083' ]
      - [ "$.uavEquipmentRentItemList[0].rentCount", 1 ]
    expected:
      - [ "$.success","eq",false ]
      - [ "$.message","eq","存在设备正在维修中，请核实后再提交" ]
      - [ "$.result","len_gt",0 ]

